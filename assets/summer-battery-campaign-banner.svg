<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Repair540 サマーバッテリー交換キャンペーン</title>
  <desc id="desc">夏らしい配色のサマーバッテリー交換キャンペーン横長バナー</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8dd"/>
      <stop offset="48%" stop-color="#ffe18a"/>
      <stop offset="100%" stop-color="#ff9a4d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a69b8"/>
      <stop offset="100%" stop-color="#0d3f8f"/>
    </linearGradient>
    <linearGradient id="battery" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="36" fill="url(#bg)"/>
  <path d="M0 310C163 274 327 246 490 246C742 246 875 332 1122 332C1278 332 1434 294 1600 250V420H0Z" fill="url(#sea)" opacity="0.95"/>
  <circle cx="1278" cy="108" r="64" fill="#fff2b0" opacity="0.95"/>
  <g opacity="0.28">
    <circle cx="1396" cy="78" r="12" fill="#ffffff"/>
    <circle cx="1452" cy="126" r="8" fill="#ffffff"/>
    <circle cx="1340" cy="160" r="10" fill="#ffffff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1002" y="76" width="422" height="214" rx="34" fill="#ffffff" opacity="0.96"/>
    <rect x="1040" y="114" width="228" height="96" rx="22" fill="#e5eef9"/>
    <rect x="1064" y="138" width="172" height="48" rx="16" fill="url(#battery)"/>
    <rect x="1242" y="146" width="18" height="32" rx="8" fill="#94a3b8"/>
    <path d="M1178 112l16 28h-20l16 28" fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"/>
    <text x="1048" y="246" fill="#0d3f8f" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="40" font-weight="800">最短即日・見積無料</text>
  </g>

  <text x="94" y="108" fill="#0d3f8f" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="42" font-weight="700" letter-spacing="0.08em">REPAIR540</text>
  <text x="94" y="196" fill="#7c2d12" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="86" font-weight="900">サマーバッテリー交換</text>
  <text x="94" y="276" fill="#7c2d12" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="86" font-weight="900">キャンペーン</text>
  <text x="98" y="338" fill="#ffffff" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="32" font-weight="700">iPhone / Android 対応</text>
  <text x="424" y="338" fill="#dbeafe" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="28" font-weight="600">バッテリーの減りが早い・急に電源が落ちるならご相談ください</text>

  <g>
    <rect x="92" y="48" width="176" height="42" rx="21" fill="#ffffff" opacity="0.72"/>
    <text x="122" y="77" fill="#b45309" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="24" font-weight="800">SUMMER CAMPAIGN</text>
  </g>
