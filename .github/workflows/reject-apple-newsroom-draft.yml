name: Reject Apple Newsroom Draft

on:
  workflow_dispatch:
    inputs:
      draft_title_manual:
        description: 'blog/posts/apple-newsroom-drafts/index.html の選択番号または記事タイトルを入力'
        required: true

concurrency:
  group: blog-draft-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reject-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reject selected draft
        env:
          DRAFT_TITLE_MANUAL: ${{ inputs.draft_title_manual }}
        run: |
          set -euo pipefail
          SELECTED_TITLE="${DRAFT_TITLE_MANUAL:-}"
          if [ -z "${SELECTED_TITLE}" ]; then
            echo "::error::却下対象が選択されていません。blog/posts/apple-newsroom-drafts/index.html の選択番号または記事タイトルを入力してください。"
            exit 1
          fi
          node scripts/reject-apple-newsroom-draft.mjs "--draft-title=${SELECTED_TITLE}"

      - name: Rebuild draft index
        run: node scripts/build-apple-newsroom-drafts-index.mjs

      - name: Commit rejected draft
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog/posts

          if git diff --cached --quiet; then
            echo "No reject changes were staged."
            exit 0
          fi

          git fetch origin main

          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto origin/main before rejecting draft."
            git status --short || true
            git log --oneline --decorate -5 || true
            git rebase --abort || true
            exit 1
          fi

          git add blog/posts

          if git diff --cached --quiet; then
            echo "No staged reject changes remained after rebase."
            exit 0
          fi

          git commit -m "Reject Apple Newsroom draft"

          echo "Rebasing committed reject changes onto latest origin/main before push..."
          if ! git pull --rebase origin main; then
            echo "::error::Failed to rebase committed reject changes onto origin/main before push."
            git status --short || true
            git log --oneline --decorate -8 || true
            git rebase --abort || true
            exit 1
          fi

          echo "Pushing rejected draft changes to origin/main..."
          if ! git push origin HEAD:main; then
            echo "::warning::Initial push was rejected. Retrying once after pull --rebase."
            git fetch origin main || true
            if ! git pull --rebase origin main; then
              echo "::error::Retry rebase failed after reject push rejection."
              git status --short || true
              git log --oneline --decorate -8 || true
              git rebase --abort || true
              exit 1
            fi

            if ! git push origin HEAD:main; then
              echo "::error::Push rejected again after one retry while rejecting draft."
              git status --short || true
              git log --oneline --decorate -8 || true
              exit 1
            fi
          fi
