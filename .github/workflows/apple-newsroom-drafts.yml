name: Generate Apple Newsroom Drafts

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Apple Newsroom drafts
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
        run: node scripts/generate-apple-newsroom-drafts.mjs --report-file="${REPORT_FILE}"

      - name: Rebuild draft index
        run: node scripts/build-apple-newsroom-drafts-index.mjs

      - name: Read report
        id: report
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
        run: |
          node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync(process.env.REPORT_FILE,"utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "draft_count=" + report.draftCount + "\n");'

      - name: Commit generated drafts
        if: steps.report.outputs.draft_count != '0'
        env:
          WORKFLOW_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTENT_PATHS="blog/posts"
          WORKFLOW_PATHS=".github/workflows/publish-apple-newsroom-draft.yml .github/workflows/reject-apple-newsroom-draft.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${WORKFLOW_SYNC_TOKEN}" ]; then
            echo "Using WORKFLOW_SYNC_TOKEN to sync workflow dispatch candidate lists."
            git remote set-url origin "https://x-access-token:${WORKFLOW_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            COMMIT_PATHS="${CONTENT_PATHS} ${WORKFLOW_PATHS}"
          else
            echo "WORKFLOW_SYNC_TOKEN is not set. Workflow candidate list changes will be discarded."
            git restore ${WORKFLOW_PATHS}
            COMMIT_PATHS="${CONTENT_PATHS}"
          fi

          echo "Staging generated draft-related files before rebase..."
          git add ${COMMIT_PATHS}

          if git diff --cached --quiet; then
            echo "No draft file changes to commit before rebase. Exiting successfully."
            exit 0
          fi

          echo "Changed files before rebase:"
          git diff --cached --name-status

          echo "Cleaning any leftover untracked workflow report file..."
          rm -f apple-newsroom-run-report.json

          echo "Fetching latest origin/main..."
          git fetch origin main

          echo "Rebasing workflow branch onto latest origin/main..."
          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto origin/main before committing generated drafts."
            echo "Git status:"
            git status --short || true
            echo "Recent commits:"
            git log --oneline --decorate -5 || true
            git rebase --abort || true
            exit 1
          fi

          echo "Restaging draft-related files after rebase..."
          if [ -z "${WORKFLOW_SYNC_TOKEN}" ]; then
            git restore ${WORKFLOW_PATHS}
          fi
          git add ${COMMIT_PATHS}

          if git diff --cached --quiet; then
            echo "No draft file changes to commit after rebase. Exiting successfully."
            exit 0
          fi

          echo "Changed files to commit:"
          git diff --cached --name-status

          git commit -m "Add Apple Newsroom blog draft"

          echo "Rebasing committed draft changes onto latest origin/main before push..."
          if ! git pull --rebase origin main; then
            echo "::error::Failed to rebase committed generated drafts onto origin/main before push."
            echo "Git status:"
            git status --short || true
            echo "Recent commits:"
            git log --oneline --decorate -8 || true
            git rebase --abort || true
            exit 1
          fi

          echo "Pushing generated drafts to origin/main..."
          if ! git push origin HEAD:main; then
            echo "::warning::Initial push was rejected. Trying one fetch/rebase/push recovery."
            echo "Remote main may have advanced during this workflow run."
            echo "Fetching latest origin/main again..."
            git fetch origin main || true
            echo "Rebasing committed draft changes onto latest origin/main..."
            if ! git pull --rebase origin main; then
              echo "::error::Recovery rebase failed after push rejection."
              echo "Git status:"
              git status --short || true
              echo "Changed files:"
              git diff --name-status HEAD~1..HEAD || true
              echo "Recent commits:"
              git log --oneline --decorate -8 || true
              echo "Remote head:"
              git rev-parse origin/main || true
              git rebase --abort || true
              exit 1
            fi

            echo "Retrying push after recovery rebase..."
            if git push origin HEAD:main; then
              echo "Recovery push succeeded."
              exit 0
            fi

            echo "::error::Push rejected after retry. origin/main advanced again or branch protections blocked the push."
            echo "Git status:"
            git status --short || true
            echo "Changed files in the last commit:"
            git diff --name-status HEAD~1..HEAD || true
            echo "Recent commits:"
            git log --oneline --decorate -8 || true
            echo "Local HEAD:"
            git rev-parse HEAD || true
            echo "Remote HEAD:"
            git rev-parse origin/main || true
            exit 1
          fi

      - name: Send LINE notification
        if: steps.report.outputs.draft_count != '0'
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-draft-notifications.mjs --report-file="${REPORT_FILE}"

# Required GitHub Secrets:
# - LINE_CHANNEL_ACCESS_TOKEN : LINE Messaging API channel access token
# - LINE_USER_ID              : push message destination userId
# - WORKFLOW_SYNC_TOKEN       : optional PAT with workflow update permission for dispatch candidate sync
