name: Generate Apple Newsroom Drafts

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Apple Newsroom drafts
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
        run: node scripts/generate-apple-newsroom-drafts.mjs --report-file="${REPORT_FILE}"

      - name: Rebuild draft index
        run: node scripts/build-apple-newsroom-drafts-index.mjs

      - name: Read report
        id: report
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
        run: |
          node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync(process.env.REPORT_FILE,"utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "draft_count=" + report.draftCount + "\n");'

      - name: Commit generated drafts
        if: steps.report.outputs.draft_count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Staging generated blog draft files before rebase..."
          git add blog/posts .github/workflows/publish-apple-newsroom-draft.yml .github/workflows/reject-apple-newsroom-draft.yml

          if git diff --cached --quiet; then
            echo "No staged blog draft changes before rebase."
            exit 0
          fi

          echo "Cleaning any leftover untracked workflow report file..."
          rm -f apple-newsroom-run-report.json

          echo "Fetching latest origin/main..."
          git fetch origin main

          echo "Rebasing workflow branch onto latest origin/main..."
          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto origin/main before committing generated drafts."
            echo "Git status:"
            git status --short || true
            echo "Recent commits:"
            git log --oneline --decorate -5 || true
            git rebase --abort || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No staged blog draft changes after rebase."
            exit 0
          fi

          git commit -m "Add Apple Newsroom blog draft"

          echo "Pushing generated drafts to origin/main..."
          if ! git push origin HEAD:main; then
            echo "::error::Push rejected after commit. origin/main may have advanced during this workflow run."
            echo "Git status:"
            git status --short || true
            echo "Recent commits:"
            git log --oneline --decorate -5 || true
            exit 1
          fi

      - name: Send LINE notification
        if: steps.report.outputs.draft_count != '0'
        env:
          REPORT_FILE: ${{ runner.temp }}/apple-newsroom-run-report.json
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node scripts/send-line-draft-notifications.mjs --report-file="${REPORT_FILE}"

# Required GitHub Secrets:
# - LINE_CHANNEL_ACCESS_TOKEN : LINE Messaging API channel access token
# - LINE_USER_ID              : push message destination userId
