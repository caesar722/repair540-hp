name: Publish Apple Newsroom Draft

on:
  workflow_dispatch:
    inputs:
      draft_title:
        description: 'Web版向け。公開する記事タイトルを選択'
        required: false
        type: choice
        options:
          - 'Apple Intelligence、パワフルなAI機能を日々の体験に'
          - 'Appleがこれまでよりはるかに有能でパーソナルなアシスタントであるSiri AIを発表'
          - 'Appleがデベロッパのビジネスの成長と新たなユーザーへのリーチを支援するためにApp Storeの機能を拡大'
          - 'Appleが新しいインテリジェンスフレームワークと先進的なツールでアプリ開発を加速'
          - 'WWDC26：Apple、次世代のApple Intelligence、Siri AI、パワフルなペアレンタルコントロール、広範なソフトウェアの機能強化を発表'
          - 'デジタル市場法の影響により、EU域内ではiOS 27とiPadOS 27へのSiri AIの提供が延期されます'
          - 'App Storeのエコシステムが過去最高の1.4兆ドル規模に到達、世界中のデベロッパが引き続き躍進'
          - 'AppleとMajor League Baseball、「フライデーナイト ベースボール」の7月のスケジュールを発表'
          - 'Appleが2026年Apple Design Awardsの受賞者を発表'
          - '2025年、App Storeは不正取引と見なされた取引22億ドル以上を阻止'
          - 'Appleが新しいアクセシビリティ機能とApple Intelligenceを活用したアップデートを発表'
      draft_title_manual:
        description: 'iPhone版GitHubアプリ用。下の候補一覧の番号または記事タイトルを入力'
        required: false
        default: ''
      draft_candidates:
        description: '候補一覧（表示専用・編集不要）'
        required: false
        default: |
          1. Apple Intelligence、パワフルなAI機能を日々の体験に
          2. Appleがこれまでよりはるかに有能でパーソナルなアシスタントであるSiri AIを発表
          3. Appleがデベロッパのビジネスの成長と新たなユーザーへのリーチを支援するためにApp Storeの機能を拡大
          4. Appleが新しいインテリジェンスフレームワークと先進的なツールでアプリ開発を加速
          5. WWDC26：Apple、次世代のApple Intelligence、Siri AI、パワフルなペアレンタルコントロール、広範なソフトウェアの機能強化を発表
          6. デジタル市場法の影響により、EU域内ではiOS 27とiPadOS 27へのSiri AIの提供が延期されます
          7. App Storeのエコシステムが過去最高の1.4兆ドル規模に到達、世界中のデベロッパが引き続き躍進
          8. AppleとMajor League Baseball、「フライデーナイト ベースボール」の7月のスケジュールを発表
          9. Appleが2026年Apple Design Awardsの受賞者を発表
          10. 2025年、App Storeは不正取引と見なされた取引22億ドル以上を阻止
          11. Appleが新しいアクセシビリティ機能とApple Intelligenceを活用したアップデートを発表
      category:
        description: '公開カテゴリ'
        required: false
        default: 'コラム'
      emoji:
        description: '記事一覧で使う絵文字'
        required: false
        default: '📰'

permissions:
  contents: write

jobs:
  publish-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish selected draft
        env:
          DRAFT_TITLE: ${{ inputs.draft_title }}
          DRAFT_TITLE_MANUAL: ${{ inputs.draft_title_manual }}
          CATEGORY: ${{ inputs.category }}
          EMOJI: ${{ inputs.emoji }}
        run: |
          set -euo pipefail
          SELECTED_TITLE="${DRAFT_TITLE_MANUAL:-}"
          if [ -z "${SELECTED_TITLE}" ]; then
            SELECTED_TITLE="${DRAFT_TITLE:-}"
          fi
          if [ -z "${SELECTED_TITLE}" ] || [ "${SELECTED_TITLE}" = "（公開・却下できる下書きなし）" ]; then
            echo "::error::公開対象が選択されていません。Web版は選択欄、iPhone版GitHubアプリは draft_title_manual に番号または記事タイトルを入力してください。"
            exit 1
          fi
          node scripts/publish-apple-newsroom-draft.mjs \
            "--draft-title=${SELECTED_TITLE}" \
            --category="${CATEGORY}" \
            --emoji="${EMOJI}"

      - name: Rebuild draft index
        run: node scripts/build-apple-newsroom-drafts-index.mjs

      - name: Commit published post
        env:
          WORKFLOW_SYNC_TOKEN: ${{ secrets.WORKFLOW_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTENT_PATHS="posts.json sitemap.xml blog/posts"
          WORKFLOW_PATHS=".github/workflows/publish-apple-newsroom-draft.yml .github/workflows/reject-apple-newsroom-draft.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${WORKFLOW_SYNC_TOKEN}" ]; then
            echo "Using WORKFLOW_SYNC_TOKEN to sync workflow dispatch candidate lists."
            git remote set-url origin "https://x-access-token:${WORKFLOW_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            COMMIT_PATHS="${CONTENT_PATHS} ${WORKFLOW_PATHS}"
          else
            echo "WORKFLOW_SYNC_TOKEN is not set. Workflow candidate list changes will be discarded."
            git restore ${WORKFLOW_PATHS}
            COMMIT_PATHS="${CONTENT_PATHS}"
          fi

          git add ${COMMIT_PATHS}

          if git diff --cached --quiet; then
            echo "No publish changes were staged."
            exit 0
          fi

          git fetch origin main

          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto origin/main before publishing draft."
            git status --short || true
            git log --oneline --decorate -5 || true
            git rebase --abort || true
            exit 1
          fi

          if [ -z "${WORKFLOW_SYNC_TOKEN}" ]; then
            git restore ${WORKFLOW_PATHS}
          fi

          git add ${COMMIT_PATHS}

          if git diff --cached --quiet; then
            echo "No staged changes remained after rebase."
            exit 0
          fi

          git commit -m "Publish Apple Newsroom draft"

          echo "Rebasing committed publish changes onto latest origin/main before push..."
          if ! git pull --rebase origin main; then
            echo "::error::Failed to rebase committed publish changes onto origin/main before push."
            git status --short || true
            git log --oneline --decorate -8 || true
            git rebase --abort || true
            exit 1
          fi

          echo "Pushing published draft changes to origin/main..."
          if ! git push origin HEAD:main; then
            echo "::warning::Initial push was rejected. Retrying once after pull --rebase."
            git fetch origin main || true
            if ! git pull --rebase origin main; then
              echo "::error::Retry rebase failed after publish push rejection."
              git status --short || true
              git log --oneline --decorate -8 || true
              git rebase --abort || true
              exit 1
            fi

            if ! git push origin HEAD:main; then
              echo "::error::Push rejected again after one retry while publishing draft."
              git status --short || true
              git log --oneline --decorate -8 || true
              exit 1
            fi
          fi
