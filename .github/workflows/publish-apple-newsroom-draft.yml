name: Publish Apple Newsroom Draft

on:
  workflow_dispatch:
    inputs:
      draft_title:
        description: '公開する記事タイトル（推奨。完全一致、または一意に特定できる一部を入力）'
        required: false
        default: ''
      draft_file:
        description: '公開する下書きHTMLのパス（タイトル指定しない場合）'
        required: false
        default: ''
      category:
        description: '公開カテゴリ'
        required: false
        default: 'コラム'
      emoji:
        description: '記事一覧で使う絵文字'
        required: false
        default: '📰'

permissions:
  contents: write

jobs:
  publish-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish selected draft
        env:
          DRAFT_TITLE: ${{ inputs.draft_title }}
          DRAFT_FILE: ${{ inputs.draft_file }}
          CATEGORY: ${{ inputs.category }}
          EMOJI: ${{ inputs.emoji }}
        run: |
          set -euo pipefail
          publish_args=()

          if [ -n "${DRAFT_TITLE}" ]; then
            publish_args+=("--draft-title=${DRAFT_TITLE}")
          fi

          if [ -n "${DRAFT_FILE}" ]; then
            publish_args+=("--draft-file=${DRAFT_FILE}")
          fi

          node scripts/publish-apple-newsroom-draft.mjs \
            "${publish_args[@]}" \
            --category="${CATEGORY}" \
            --emoji="${EMOJI}"

      - name: Commit published post
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json sitemap.xml

          if git diff --cached --quiet; then
            echo "No publish changes were staged."
            exit 0
          fi

          git fetch origin main

          if ! git pull --rebase --autostash origin main; then
            echo "::error::Failed to rebase onto origin/main before publishing draft."
            git status --short || true
            git log --oneline --decorate -5 || true
            git rebase --abort || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No staged changes remained after rebase."
            exit 0
          fi

          git commit -m "Publish Apple Newsroom draft"
          git push origin HEAD:main
